name: Build Windows Release

# Kích hoạt khi:
# - Push lên nhánh main -> build kiểm tra compile OK (không tạo release)
# - Push tag dạng v* (ví dụ v0.2.0) -> build và đính kèm .exe vào GitHub Release
# - Bấm "Run workflow" thủ công trên tab Actions
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  BINARY_NAME: roblox-ram-trimmer

jobs:
  build:
    # Bắt buộc chạy trên Windows vì code dùng WinAPI.
    runs-on: windows-latest

    # Bước tạo Release cần quyền ghi. Nếu repo đặt GITHUB_TOKEN mặc định là
    # "read-only" thì thiếu dòng này sẽ lỗi 403 khi push tag.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Rust toolchain 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: x86_64-pc-windows-msvc

      # Cache registry + target để các lần build sau nhanh hơn.
      - name: Cache cargo registry & build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Xác định đường dẫn binary vừa build
        id: artifact
        shell: bash
        run: |
          echo "path=target/x86_64-pc-windows-msvc/release/${{ env.BINARY_NAME }}.exe" >> "$GITHUB_OUTPUT"

      # Luôn upload artifact để tải binary ngay từ tab Actions.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x64
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      # Chỉ tạo GitHub Release khi push tag v*:
      #   git tag v0.2.0 && git push origin v0.2.0
      - name: Tạo GitHub Release (chỉ khi push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
